<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf Live">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<title>Golf Live ⛳</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Tahoma,sans-serif;background:#eef3ee;color:#1c2b1c;padding-bottom:calc(78px + env(safe-area-inset-bottom));font-size:16px}
body.nonav{padding-bottom:20px}
header{position:sticky;top:0;z-index:1000;background:#1b5e20;color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px #0003}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.9;font-size:12px;text-align:right;line-height:1.2}
.dot{width:10px;height:10px;border-radius:50%;background:#9e9e9e;flex:none}.dot.on{background:#69f0ae;box-shadow:0 0 6px #69f0ae}
.hb{border:0;border-radius:10px;background:#ffffff22;color:#fff;font-size:18px;line-height:1;width:40px;height:36px;flex:none;padding:0;display:inline-flex;align-items:center;justify-content:center}
.hb.on{background:#fff;color:#1b5e20}
main{padding:12px;max-width:680px;margin:0 auto}
nav[hidden]{display:none!important}
.gpsrow{display:flex;justify-content:space-around;align-items:flex-end;text-align:center}.gpsrow div{line-height:1.05}.gpsrow b{font-size:22px;color:#1b5e20;display:block}.gpsrow b.c{font-size:34px}.gpsrow small{font-size:11px;color:#556}
.replay .rp-map{height:360px;border-radius:12px;overflow:hidden;margin:8px 0;background:#333}
.replay .chips{padding:4px 0}
.rp-row{padding:6px 0;border-bottom:1px solid #eef2ee;font-size:14px}.rp-row:last-of-type{border:0}
input.bad{border:2px solid #e53935!important;background:#fff5f5}
.qrscan{position:relative;width:100%;aspect-ratio:1;background:#000;border-radius:12px;overflow:hidden}.qrscan video{width:100%;height:100%;object-fit:cover;display:block}
.qrframe{position:absolute;inset:16%;border:3px solid #ffd600;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.parbig{font-size:20px;font-weight:800;color:#1b5e20}
.partbl{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.partbl div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.partbl select,.partbl input{padding:6px 0;text-align:center;font-size:15px;width:100%;border-radius:8px}
.partbl input{font-size:12px;padding:4px 0}
.mwiz{position:absolute;left:8px;right:8px;top:72px;z-index:600;background:#fffffff5;border-radius:14px;padding:10px 12px;box-shadow:0 3px 12px #0005;font-size:15px}
.mwiz[hidden]{display:none}
.mbot[hidden]{display:none}
#mapwrap.wiz .mside,#mapwrap.wiz .mbot{display:none}
.mwiz .btn{padding:10px 4px}
.hnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#fff;color:#1b5e20;font-size:12px;font-weight:800;border:2px solid #1b5e20;transform:translate(-32px,-6px);box-shadow:0 1px 3px #0005}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccd;z-index:1000;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:7px 0 9px;font-size:21px;color:#667;font-family:inherit}
nav button span{display:block;font-size:11px;margin-top:1px}
nav button.on{color:#1b5e20;font-weight:700;background:#e6f2e6}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.card h2{font-size:16px;margin:0 0 10px;color:#1b5e20}
input,textarea,select{font-size:16px;padding:10px;border:1px solid #bcc;border-radius:10px;width:100%;background:#fafdfa;font-family:inherit;color:inherit}
input.pin{font-size:32px;letter-spacing:14px;text-align:center;font-weight:800}
.btn{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;background:#1b5e20;color:#fff;font-family:inherit;display:inline-block;text-align:center;text-decoration:none}
.btn.sec{background:#e3ece3;color:#1b5e20}.btn.red{background:#fde8e8;color:#c62828}.btn.full{width:100%;margin-top:8px}.btn:disabled{opacity:.4}
.big-btn{font-size:19px;padding:18px}
.x{border:0;background:#fde8e8;color:#c62828;border-radius:10px;width:40px;height:40px;font-size:15px;flex:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid #bcc;background:#fff;border-radius:10px;padding:10px 0;font-size:15px;font-weight:600;color:#445;font-family:inherit}
.seg button.on{background:#1b5e20;color:#fff;border-color:#1b5e20}
.seg button.on.l{background:#e65100;border-color:#e65100}.seg button.on.r{background:#1565c0;border-color:#1565c0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
label.lb{font-size:13px;color:#667;display:block;margin:8px 0 4px}
.muted{color:#778;font-size:13px}.center{text-align:center}
.note{background:#fff8e1;border-radius:10px;padding:8px 10px;font-size:13px;color:#6d4c00;margin:8px 0}
.ok{background:#e8f5e9;color:#1b5e20}
.holebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.holebar .nm{text-align:center}.holebar .nm b{font-size:28px}
.holebar button{width:56px;height:48px;border:0;border-radius:12px;background:#e3ece3;color:#1b5e20;font-size:22px;font-weight:700}
.chips{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px}
.chips button{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid #bcc;background:#fff;font-weight:700;color:#556}
.chips button.done{background:#c8e6c9;border-color:#81c784;color:#1b5e20}.chips button.all{background:#81c784;border-color:#43a047}
.chips button.cur{background:#1b5e20;color:#fff;border-color:#1b5e20}
.pcard{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px #0001;border-left:6px solid #ccc}
.pcard.ok{border-left-color:#43a047}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:6px}
.ptop .n{font-weight:700;font-size:17px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:13px;font-weight:700;background:#eee;color:#555;margin-left:4px;white-space:nowrap}
.b-eagle{background:#fff176;color:#6d4c00}.b-birdie{background:#ffcdd2;color:#b71c1c}.b-par{background:#e0e0e0;color:#333}
.b-bogey{background:#bbdefb;color:#0d47a1}.b-dbl{background:#90caf9;color:#0d47a1}.b-worse{background:#5c6bc0;color:#fff}.b-gir{background:#c8e6c9;color:#1b5e20}
.frow{display:flex;align-items:center;justify-content:space-between;margin:6px 0;gap:8px}
.frow .t{font-size:14px;color:#556;flex:none;width:96px;line-height:1.2}.frow .t small{display:block;font-size:11px;color:#889}
.step{display:flex;align-items:center;gap:6px}
.step button{width:52px;height:48px;border:0;border-radius:10px;background:#e3ece3;color:#1b5e20;font-size:26px;font-weight:700}
.step span{min-width:40px;text-align:center;font-size:28px;font-weight:800}
.frow .seg{flex:1}.frow .seg button{padding:9px 0;font-size:14px}
.pen button{border:1px solid #bcc;background:#fff;border-radius:10px;padding:7px 0;font-size:13px;font-weight:600;color:#445;line-height:1.2;font-family:inherit}
.pen button b{display:block;font-size:12px}.pen button.on{background:#c62828;color:#fff;border-color:#c62828}.pen button.on.sand{background:#a1887f;border-color:#a1887f}
.formula{font-size:12px;color:#667;text-align:right;margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 5px;text-align:center;border-bottom:1px solid #e3e8e3;white-space:nowrap}
th{background:#f1f6f1;color:#335;font-size:13px}td.l,th.l{text-align:left}
.scroll{overflow-x:auto}.pay{color:#c62828;font-weight:700}
.sc-u{color:#c62828;font-weight:700}.sc-o{color:#1565c0}
td small{display:block;font-size:10px;color:#c62828;font-weight:700}
tr.tot td{background:#f1f6f1}table.sc sup{color:#43a047;font-size:9px}
tr.me td{background:#f1f8e9}
.hcp{font-size:18px;font-weight:800;color:#1b5e20}.big{font-size:22px;font-weight:800;color:#1b5e20}
.dlg{position:fixed;inset:0;background:#0007;z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}
.dlgbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:380px;text-align:center;font-size:17px;max-height:90vh;overflow:auto}
.dlgbox p{margin:4px 0 14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222e;color:#fff;padding:10px 18px;border-radius:20px;z-index:4000;font-size:15px;max-width:90%;text-align:center}
.aw{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef2ee}.aw:last-child{border-bottom:0}
.ai{font-size:26px;width:34px;text-align:center}.at{font-size:13px;color:#667}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px;font-size:12px;color:#445}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.drow{display:flex;align-items:center;gap:8px;margin:6px 0}.dn{width:76px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.dbar{flex:1;display:flex;gap:2px;height:24px}
.dbar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:6px}
.dbar span:first-child{border-radius:4px 0 0 4px}.dbar span:last-child{border-radius:0 4px 4px 0}.dbar span:only-child{border-radius:4px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}
.sw{width:56px;height:32px;border-radius:16px;border:0;background:#ccc;position:relative;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#43a047}.sw.on::after{left:27px}
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;flex:none}
/* live */
.who{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wcard{flex:none;min-width:96px;background:#f6faf6;border:1px solid #dfe8df;border-radius:12px;padding:8px;text-align:center}
.wcard .h{font-size:22px;font-weight:800;color:#1b5e20}.wcard .nm{font-size:13px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#43a047;margin-right:4px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.feed div{padding:6px 0;border-bottom:1px solid #eef2ee;font-size:14px}.feed div:last-child{border:0}
.qr{display:flex;justify-content:center;margin:6px 0}.qr svg{width:240px;height:240px}
.code{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;color:#1b5e20}
.dice{font-size:64px;display:inline-block;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pick{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;background:#fff3e0;margin:6px 0;font-size:16px}
/* map */
#mapwrap{position:fixed;left:0;right:0;top:calc(54px + env(safe-area-inset-top));bottom:calc(62px + env(safe-area-inset-bottom));z-index:1}
#map{position:absolute;inset:0;background:#7cb67c}
.mtop{position:absolute;top:8px;left:8px;right:8px;z-index:500;display:flex;gap:6px;align-items:stretch}
.mbox{background:#fffffff0;border-radius:12px;padding:6px 10px;box-shadow:0 2px 8px #0003}
.mhole{display:flex;align-items:center;gap:4px}.mhole button{border:0;background:#e3ece3;border-radius:8px;width:36px;height:36px;font-size:18px;font-weight:800;color:#1b5e20}
.mdist{flex:1;display:flex;justify-content:space-around;text-align:center}
.mdist div{line-height:1.05}.mdist b{font-size:26px;color:#1b5e20;display:block}.mdist small{font-size:11px;color:#556}
.mbot{position:absolute;bottom:10px;left:8px;right:8px;z-index:500;display:flex;gap:6px}
.mbot .btn{flex:1;box-shadow:0 2px 8px #0004;padding:13px 6px}
.mside{position:absolute;right:8px;top:72px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mside button{width:44px;height:44px;border-radius:12px;border:0;background:#fffffff0;font-size:20px;box-shadow:0 2px 6px #0003}
.mside button.on{background:#1b5e20;color:#fff}
.mlbl{background:#1b5e20;color:#fff;border-radius:8px;padding:2px 6px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid #fff}
.mlbl.y{background:#fdd835;color:#222}.mlbl.w{background:#fff;color:#1b5e20;border-color:#1b5e20}
.leaflet-div-icon{background:none;border:0}
.pp{display:flex;align-items:center;transform:translate(-17px,-17px);pointer-events:auto}
.pp b{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px #0006;flex:none}
.pp span{background:#fff;color:#1c2b1c;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:3px;white-space:nowrap;box-shadow:0 1px 4px #0005}
.pp.stale{opacity:.55}
.cmain{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmain button{border:2px solid #1b5e20;background:#fff;border-radius:12px;padding:14px 0 10px;color:#1b5e20;font-family:inherit}
.cmain button b{display:block;font-size:22px}.cmain button small{font-size:11px;color:#556}
.cmain button:active{background:#1b5e20;color:#fff}
.cnum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.cnum button{border:2px solid #bcc;background:#fff;border-radius:12px;padding:16px 0;font-size:19px;font-weight:800;color:#1c2b1c;font-family:inherit}
.cnum button.on{border-color:#1b5e20;background:#e8f5e9;color:#1b5e20}
.csub{display:flex;align-items:center;gap:4px;margin:4px 0;flex-wrap:wrap}.csub span{width:46px;font-size:12px;color:#667;text-align:left}
.csub button{border:1px solid #bcc;background:#fff;border-radius:8px;padding:7px 9px;font-weight:700;font-size:14px;font-family:inherit}
.shots{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0}.shots i{color:#99a;font-style:normal}
.shot{background:#fff8e1;border:1px solid #f0d58c;border-radius:8px;padding:5px 8px;font-size:14px}.shot b{color:#e65100}
.clubs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.clubs button{padding:12px 0;border-radius:10px;border:1px solid #bcc;background:#fff;font-weight:700;font-size:15px}
/* sun */
body.sun{background:#fff;color:#000;font-size:18px}
body.sun .card,body.sun .pcard{box-shadow:none;border:2px solid #222}body.sun .pcard{border-left-width:8px}
body.sun .muted,body.sun .frow .t,body.sun label.lb,body.sun .formula{color:#000;font-weight:600}
body.sun .step button{background:#1b5e20;color:#fff;width:58px;height:54px;font-size:30px}body.sun .step span{font-size:34px}
body.sun .seg button,body.sun .pen button{border:2px solid #000;color:#000;font-weight:800}
body.sun .seg button.on,body.sun .pen button.on{color:#fff}
body.sun th{background:#ddd;color:#000}body.sun td,body.sun th{border-bottom:1px solid #999}body.sun input{border:2px solid #000;color:#000}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><h1 id="title">⛳ Golf Live</h1><small id="hinfo"></small>
  <button class="hb" data-act="sun" title="โหมดกลางแดด">🌞</button><button class="hb" data-act="wake" title="กันจอดับ">💡</button></header>
<main id="app"><div class="card center muted">กำลังโหลด...</div></main>
<nav id="tabs" hidden>
  <button data-tab="hole">⛳<span>จดสกอร์</span></button>
  <button data-tab="map">🗺️<span>แผนที่</span></button>
  <button data-tab="live">📡<span>สด</span></button>
  <button data-tab="sum">🏁<span>สรุป</span></button>
  <button data-tab="gang">👥<span>แก๊ง</span></button>
</nav>
<script src="vendor/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
