<body>
<header><h1>⛳ Golf Score</h1><small id="hinfo"></small>
  <button class="hb" data-act="sun" title="โหมดกลางแดด">🌞</button><button class="hb" data-act="wake" title="กันจอดับ">💡</button></header>
<main id="app"></main>
<nav id="tabs">
  <button data-tab="setup">⚙️<span>ตั้งค่า</span></button>
  <button data-tab="hole">⛳<span>บันทึกหลุม</span></button>
  <button data-tab="sum">📊<span>สรุป / เงิน</span></button>
  <button data-tab="hist">📚<span>ประวัติ</span></button>
</nav>
<script>
const KEY='golf_offline_v1',FLIGHTS=['A','B','C'];
const PEN=[['lost','🌳','ป่า/หาย',1],['water','💧','ตกน้ำ',1],['ob','🚫','OB',1],['bunker','🏖️','บังเกอร์',0]];
const app=document.getElementById('app');
let spinning=false,wheelRot=0;

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newHole(){return{par:4,parSet:false,si:'',spin:null,s:{}}}
function newHoles(){return Array.from({length:18},newHole)}
function defState(){return{rid:uid(),players:[1,2,3,4].map(k=>({id:uid(),name:'ผู้เล่น '+k,flight:'A',hc:''})),
  holes:18,cr:'',slope:'',amtLast:20,amtSpin:10,moneyBy:'gross',sortBy:'gross',lunch:'',course:'',tee:'',date:'',tieRule:'all',remind:{},
  cur:0,tab:'setup',myFlight:'all',sun:false,wake:true,H:newHoles()}}
function migrate(s){
  const d=defState();for(const k in d)if(s[k]===undefined)s[k]=d[k];
  s.players.forEach(p=>{if(!p.flight)p.flight='A';if(p.hc===undefined)p.hc=''});
  while(s.H.length<18)s.H.push(newHole());
  s.H.forEach(h=>{if(h.parSet===undefined)h.parSet=Object.keys(h.s||{}).length>0;if(h.si===undefined)h.si='';h.s=h.s||{}});
  return s;
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s?migrate(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||defState();if(!S.date)S.date=today();

/* ---------- core calc ---------- */
const P=id=>S.players.find(p=>p.id===id);
function flightsUsed(){return FLIGHTS.filter(f=>S.players.some(p=>p.flight===f))}
function visPlayers(){return S.myFlight==='all'?S.players:S.players.filter(p=>p.flight===S.myFlight)}
function ent(i,pid){const h=S.H[i];return h.s[pid]||(h.s[pid]={on:null,putt:null,tee:null,lost:0,water:0,ob:0,bunker:0})}
function penOf(e){return(e.lost||0)+(e.water||0)+(e.ob||0)}
function hasData(e){return!!e&&(e.on!=null||e.putt!=null||!!e.tee||!!(e.lost||e.water||e.ob||e.bunker))}
function score(i,pid){const e=S.H[i].s[pid];return e&&e.on!=null&&e.putt!=null?e.on+e.putt+penOf(e):null}
function gir(i,pid){const e=S.H[i].s[pid];return!!(e&&e.on!=null&&e.on+penOf(e)<=S.H[i].par-2)}
function hasHC(){return S.players.some(p=>+p.hc)}
function hcOrder(){const a=[];for(let i=0;i<S.holes;i++)a.push(i);return a.sort((x,y)=>(+S.H[x].si||99)-(+S.H[y].si||99)||x-y)}
function hStrokes(i,pid){
  const hc=Math.max(0,Math.min(54,Math.round(+P(pid).hc||0)));if(!hc)return 0;
  const N=S.holes,rank=hcOrder().indexOf(i)+1;return Math.floor(hc/N)+(rank<=hc%N?1:0);
}
function net(i,pid){const sc=score(i,pid);return sc==null?null:sc-hStrokes(i,pid)}
function metric(i,pid){return S.moneyBy==='net'&&hasHC()?net(i,pid):score(i,pid)}
function holeDone(i){return S.players.length>0&&S.players.every(p=>score(i,p.id)!=null)}
function visDone(i){const v=visPlayers();return v.length>0&&v.every(p=>score(i,p.id)!=null)}
function label(sc,par){if(sc==null)return['',''];if(sc===1)return['Hole in One!','b-eagle'];const d=sc-par;
  return d<=-3?['Albatross','b-eagle']:d===-2?['Eagle','b-eagle']:d===-1?['Birdie','b-birdie']:d===0?['Par','b-par']:d===1?['Bogey','b-bogey']:d===2?['Double','b-dbl']:['+'+d,'b-worse']}

function holeMoney(i){
  const h=S.H[i],n=S.players.length,res={pay:{},last:[],spin:[],done:false,pool:0};
  if(!holeDone(i)||n<2)return res;
  res.done=true;
  const arr=S.players.map(p=>({id:p.id,sc:metric(i,p.id)})).sort((a,b)=>a.sc-b.sc);
  const k=Math.min(2,n-1),thr=arr[n-k].sc;
  if(thr>arr[0].sc)res.last=arr.filter(x=>x.sc>=thr).map(x=>x.id);
  const pool=arr.filter(x=>!res.last.includes(x.id));res.pool=pool.length;
  if(h.spin){const ord=wheelOrder(i,pool),set=new Set();h.spin.forEach(r=>{if(r<=ord.length){const k=ord[r-1].k;ord.filter(y=>y.k===k).forEach(y=>set.add(y.id))}});res.spin=[...set]}
  res.last.forEach(id=>res.pay[id]=(res.pay[id]||0)+(+S.amtLast||0));
  res.spin.forEach(id=>res.pay[id]=(res.pay[id]||0)+(+S.amtSpin||0));
  return res;
}
function hsh(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function wheelOrder(i,pool){const pt=id=>S.H[i].s[id].putt,t=S.tieRule;
  return pool.map(x=>({...x,k:t==='putt'?x.sc+'|'+pt(x.id):t==='one'?x.id:String(x.sc),t:t==='putt'?pt(x.id):t==='one'?hsh(S.rid+i+x.id):0})).sort((a,b)=>a.sc-b.sc||a.t-b.t)}
function stats(pid){
  let gross=0,par=0,putts=0,n=0,g=0,st=0,l=0,r=0,money=0,ags=0,nt=0;
  for(let i=0;i<S.holes;i++){
    const sc=score(i,pid),e=S.H[i].s[pid];
    if(sc!=null){gross+=sc;par+=S.H[i].par;putts+=e.putt;n++;nt+=net(i,pid);if(gir(i,pid))g++;ags+=Math.min(sc,S.H[i].par+5)}
    if(e&&e.tee==='s')st++;if(e&&e.tee==='l')l++;if(e&&e.tee==='r')r++;
    money+=holeMoney(i).pay[pid]||0;
  }
  let totalPar=0;for(let i=0;i<S.holes;i++)totalPar+=S.H[i].par;
  let hcp=null,ch=null;
  if(n){const slope=+S.slope||113,cr=+S.cr?(+S.cr)*par/totalPar:par;
    let d=(113/slope)*(ags-cr)*(18/n);d=Math.max(-10,Math.min(54,d));hcp=Math.round(d*10)/10;
    const cr2=+S.cr||totalPar,f=S.holes==9?0.5:1;ch=Math.round(hcp*f*(+S.slope||113)/113+(cr2-totalPar));}
  return{gross,par,putts,n,g,st,l,r,money,hcp,ch,net:nt};
}

/* ---------- render ---------- */
function render(){
  if(spinning)return;
  document.body.classList.toggle('sun',!!S.sun);
  document.querySelector('[data-act=sun]').classList.toggle('on',!!S.sun);
  document.querySelector('[data-act=wake]').classList.toggle('on',!!S.wake);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  document.getElementById('hinfo').textContent=S.tab==='hole'?`หลุม ${S.cur+1} · Par ${S.H[S.cur].par}`:`${S.players.length} คน · ${S.holes} หลุม`;
  ({setup:rSetup,hole:rHole,sum:rSum,hist:rHist})[S.tab]();
  if(S.tab==='hole')drawWheel();
}
function sw(act,on){return`<button class="sw ${on?'on':''}" data-act="${act}"></button>`}
function flightSeg(){const fu=flightsUsed();if(fu.length<2)return'';
  return`<label class="lb">เครื่องนี้จดของ</label><div class="seg"><button data-act="myf" data-v="all" class="${S.myFlight==='all'?'on':''}">ทุกคน</button>${fu.map(f=>`<button data-act="myf" data-v="${f}" class="${S.myFlight===f?'on':''}">ก๊วน ${f}</button>`).join('')}</div>`}
function syncCard(){
  return`<div class="card"><h2>🔄 ส่ง / รับข้อมูลระหว่างเครื่อง</h2>
    <div class="grid2"><button class="btn" data-act="export">💬 ส่งเป็นข้อความ</button><button class="btn" data-act="exportfile">📁 ส่งเป็นไฟล์</button></div>
    <button class="btn sec full" data-act="import">📥 รับข้อมูล (วางข้อความ / เลือกไฟล์)</button>
    <p class="muted">💬 ข้อความ → เหมาะกับ LINE · 📁 ไฟล์ → เหมาะกับ AirDrop (ไม่ต้องใช้เน็ต) เครื่องรับกด "รับข้อมูล" → "เลือกไฟล์" ใช้ได้ทั้ง<br>• แจกรายชื่อ/ก๊วนให้อีกเครื่องก่อนออกรอบ<br>• รวมคะแนนของ 2 ก๊วนเข้าเครื่องเดียว (ส่งกี่ครั้งก็ได้ ไม่ทับกัน)<br>• สำรองข้อมูลกันมือถือแบตหมด</p></div>`}
function courseCard(){
  return`<div class="card"><h2>📐 ข้อมูลสนาม (ดูได้จาก Garmin Golf)</h2>
    <div class="grid2">
      <div><label class="lb">Course Rating</label><input type="number" step="0.1" inputmode="decimal" data-set="cr" value="${esc(S.cr)}" placeholder="เช่น 72.3"></div>

const COLORS=['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#8e24aa','#d81b60','#6d4c41','#546e7a'];
function drawWheel(){
  const c=document.getElementById('wheel');if(!c)return;
  const x=c.getContext('2d'),N=holeMoney(S.cur).pool,R=240,seg=2*Math.PI/N;
  for(let k=0;k<N;k++){const a0=-Math.PI/2+k*seg;
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R-4,a0,a0+seg);x.closePath();x.fillStyle=COLORS[k%COLORS.length];x.fill();
    x.strokeStyle='#fff';x.lineWidth=4;x.stroke();
    x.save();x.translate(R,R);x.rotate(a0+seg/2);x.fillStyle=k===2?'#333':'#fff';x.font='bold 54px sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.translate(R*0.68,0);x.rotate(Math.PI/2);x.fillText(k+1,0,0);x.restore();}
  x.beginPath();x.arc(R,R,30,0,2*Math.PI);x.fillStyle='#fff';x.fill();
  c.style.transition='none';c.style.transform=`rotate(${wheelRot}deg)`;
}
function rnd(n){const a=new Uint32Array(1);(window.crypto||{getRandomValues:v=>{v[0]=Math.random()*4294967296}}).getRandomValues(a);return a[0]%n}
function spinTo(n,N){return new Promise(res=>{
  const c=document.getElementById('wheel'),seg=360/N;
  const center=(n-1+0.5)*seg+(Math.random()-.5)*seg*0.6;
  wheelRot+=360*5+((-center-wheelRot)%360+360)%360;
  c.style.transition='transform 2.8s cubic-bezier(.15,.7,.2,1)';c.style.transform=`rotate(${wheelRot}deg)`;
  setTimeout(res,2950);})}
async function doSpin(){
  const h=S.H[S.cur];if(h.spin&&!(await ask('หลุมนี้หมุนไปแล้ว ต้องการหมุนใหม่?')))return;
  const N=holeMoney(S.cur).pool;if(!N)return;spinning=true;
  const out=document.getElementById('spinres');const a=rnd(N)+1;
  out.textContent='กำลังหมุน...';await spinTo(a,N);
  if(N>=2){let b;do{b=rnd(N)+1}while(b===a);
    out.textContent=`ครั้งที่ 1: อันดับ ${a} · กำลังหมุนครั้งที่ 2...`;
    await new Promise(r=>setTimeout(r,500));await spinTo(b,N);h.spin=[a,b];}
  else h.spin=[a];
  save();spinning=false;render();
}

/* ---------- extended stats ---------- */
const DIST=[['Eagle+','#b71c1c','#fff'],['Birdie','#e57373','#1c2b1c'],['Par','#cfd8dc','#1c2b1c'],['Bogey','#90caf9','#1c2b1c'],['Double','#42a5f5','#1c2b1c'],['Triple+','#1565c0','#fff']];
function more(pid){
  const o={dist:[0,0,0,0,0,0],pt:{3:[0,0,0],4:[0,0,0],5:[0,0,0]},out:[0,0,0],inn:[0,0,0],one:0,three:0,chip:0,gPutt:0,
    scrO:0,scrN:0,bbO:0,bbN:0,fw:{n:0,hit:0,hitD:0,missD:0},best:null,worst:null,streak:0,lastC:0,wheel:0,
    lost:0,water:0,ob:0,bunker:0,pen:0,sandN:0,sandO:0,outN:0,inN:0};
  let cur=0,prevBad=false;
  for(let i=0;i<S.holes;i++){
    const hm=holeMoney(i);if(hm.last.includes(pid))o.lastC++;if(hm.spin.includes(pid))o.wheel++;
    const e=S.H[i].s[pid];
    if(e){o.lost+=e.lost||0;o.water+=e.water||0;o.ob+=e.ob||0;o.bunker+=e.bunker||0;o.pen+=penOf(e)}
    const sc=score(i,pid);if(sc==null){cur=0;prevBad=false;continue}
    const par=S.H[i].par,d=sc-par;
    o.dist[d<=-2?0:d===-1?1:d===0?2:d===1?3:d===2?4:5]++;
    const b=o.pt[par>=5?5:par];b[0]++;b[1]+=sc;b[2]+=par;
    const hf=i<9?o.out:o.inn;hf[0]++;hf[1]+=sc;hf[2]+=par;
    if(i<9)o.outN+=net(i,pid);else o.inN+=net(i,pid);
    if(e.putt===1)o.one++;if(e.putt>=3)o.three++;if(e.putt===0)o.chip++;
    if(gir(i,pid))o.gPutt+=e.putt;else{o.scrN++;if(d<=0)o.scrO++}
    if(e.bunker){o.sandN++;if(d<=0)o.sandO++}
    if(prevBad){o.bbN++;if(d<=0)o.bbO++}prevBad=d>=1;
    if(par>=4&&e.tee){o.fw.n++;if(e.tee==='s'){o.fw.hit++;o.fw.hitD+=d}else o.fw.missD+=d}
    cur=d<=0?cur+1:0;o.streak=Math.max(o.streak,cur);
    if(!o.best||d<o.best.d)o.best={i,d,sc};if(!o.worst||d>o.worst.d)o.worst={i,d,sc};
  }
  return o;
}
function fd(d){if(d==null||isNaN(d))return'-';const r=Math.round(d*10)/10;return r===0?'E':(r>0?'+':'')+r}
function pc(a,b){return b?Math.round(a/b*100)+'%':'-'}
function av(a,b,dp=1){return b?(a/b).toFixed(dp):'-'}
function awards(list){
  const L=list.filter(x=>x.s.n>0),A=[];
  function pick(icon,title,val,fmt,better,cond){
    const c=L.filter(x=>cond?cond(x):true);if(!c.length)return;
    const vals=c.map(val),bv=better==='min'?Math.min(...vals):Math.max(...vals);
    A.push({icon,title,names:c.filter((x,k)=>vals[k]===bv).map(x=>x.p.name),v:fmt(bv)});
  }
  pick('🏆','แชมป์ Gross',x=>x.s.gross-x.s.par,v=>fd(v),'min');
  if(hasHC())pick('🥇','แชมป์ Net',x=>x.s.net-x.s.par,v=>fd(v),'min');
  pick('🎯','ราชาพัตต์',x=>x.s.putts/x.s.n,v=>v.toFixed(2)+' พัตต์/หลุม','min');
  pick('🟢','เทพ GIR',x=>x.s.g/x.s.n,v=>Math.round(v*100)+'%','max',x=>x.s.g>0);
  pick('🏌️','ไดรฟ์ตรงสุด',x=>x.m.fw.hit/x.m.fw.n,v=>Math.round(v*100)+'% ลงแฟร์เวย์','max',x=>x.m.fw.n>0&&x.m.fw.hit>0);
  pick('🐦','นักล่าเบอร์ดี้',x=>x.m.dist[0]+x.m.dist[1],v=>v+' หลุม','max',x=>x.m.dist[0]+x.m.dist[1]>0);
  pick('🔥','ฟอร์มนิ่งสุด',x=>x.m.streak,v=>'พาร์หรือดีกว่าติดกัน '+v+' หลุม','max',x=>x.m.streak>=2);
  pick('🛟','สายเซฟพาร์',x=>x.m.scrO/x.m.scrN,v=>'Scrambling '+Math.round(v*100)+'%','max',x=>x.m.scrN>0&&x.m.scrO>0);
  pick('🌳','นักสำรวจป่า',x=>x.m.lost,v=>'หาลูกไม่เจอ '+v+' ครั้ง','max',x=>x.m.lost>0);
  pick('💧','นักดำน้ำ',x=>x.m.water,v=>'ตกน้ำ '+v+' ครั้ง','max',x=>x.m.water>0);
  pick('🚫','ราชา OB',x=>x.m.ob,v=>'OB '+v+' ครั้ง','max',x=>x.m.ob>0);
  pick('🏖️','ขาประจำบังเกอร์',x=>x.m.bunker,v=>v+' ครั้ง','max',x=>x.m.bunker>0);
  pick('💸','ATM ประจำก๊วน',x=>x.s.money,v=>v+' บาท','max',x=>x.s.money>0);
  return A;
}

function rSum(){
  const hc=hasHC(),byNet=S.sortBy==='net'&&hc;
  const list=S.players.map(p=>({p,s:stats(p.id),m:more(p.id)})).sort((a,b)=>{
    const f=x=>x.s.n?(byNet?x.s.net:x.s.gross)-x.s.par:1e9;return f(a)-f(b)});
  let pot=0;list.forEach(x=>pot+=x.s.money);
  const played=list.filter(x=>x.s.n);

    ${hc?`<td><b>${s.n?s.net:'-'}</b><br><span class="${dn<0?'sc-u':'sc-o'}">${s.n?fd(dn):''}</span></td>`:''}
    <td>${s.putts}<br><span class="muted">${s.n?av(s.putts,s.n)+'/หลุม':''}</span></td>

  const distT=played.map(x=>`<tr>${nm(x)}${x.m.dist.map(c=>`<td>${c||'·'}</td>`).join('')}</tr>`).join('');

  const two=S.holes==18;

  const hl=o=>o?`H${o.i+1} <span class="muted">(${o.sc}, ${fd(o.d)})</span>`:'-';
  const parT=played.map(x=>{const m=x.m;return`<tr>${nm(x)}<td>${ptCell(m.pt[3])}</td><td>${ptCell(m.pt[4])}</td><td>${ptCell(m.pt[5])}</td>

  const shortT=played.map(x=>{const s=x.s,m=x.m;return`<tr>${nm(x)}<td>${av(s.putts,s.n,2)}</td><td>${av(m.gPutt,s.g,2)}</td>
    <td>${m.one}</td><td>${m.three}</td><td>${m.chip}</td><td>${pc(m.scrO,m.scrN)}<br><span class="muted">${m.scrO}/${m.scrN}</span></td><td>${pc(m.bbO,m.bbN)}<br><span class="muted">${m.bbO}/${m.bbN}</span></td></tr>`}).join('');
  const penT=list.map(x=>{const m=x.m;return`<tr>${nm(x)}<td>${m.lost||'·'}</td><td>${m.water||'·'}</td><td>${m.ob||'·'}</td><td class="pay">${m.pen?'+'+m.pen:'·'}</td><td>${m.bunker||'·'}</td><td>${m.sandN?pc(m.sandO,m.sandN):'-'}<br><span class="muted">${m.sandN?m.sandO+'/'+m.sandN:''}</span></td></tr>`}).join('');
  const teeT=list.map(x=>{const s=x.s,f=x.m.fw,miss=f.n-f.hit;return`<tr>${nm(x)}<td>${s.l}</td><td><b>${s.st}</b></td><td>${s.r}</td>
    <td>${pc(f.hit,f.n)}<br><span class="muted">${f.hit}/${f.n}</span></td><td>${f.hit?fd(f.hitD/f.hit):'-'}</td><td>${miss?fd(f.missD/miss):'-'}</td></tr>`}).join('');

  const bill=+S.lunch||0,n=S.players.length,extra=bill>pot&&n?Math.ceil((bill-pot)/n):0,left=pot>bill&&bill?pot-bill:0;
  const moneyT=list.map(x=>`<tr>${nm(x)}<td>${x.m.lastC}</td><td>${x.m.wheel}</td><td class="pay">${x.s.money} ฿</td>${bill?`<td><b>${x.s.money+extra} ฿</b></td>`:''}</tr>`).join('');

  let card=`<tr><th>หลุม</th><th>Par</th>${hc?'<th>HCP</th>':''}${S.players.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th>🎡</th></tr>`;
  const tot=(a,b,lab,useNet)=>{let par=0;for(let i=a;i<b;i++)par+=S.H[i].par;
    return`<tr class="tot"><td><b>${lab}</b></td><td>${par}</td>${hc?'<td></td>':''}${S.players.map(p=>{let t=0,c=0;for(let i=a;i<b;i++){const sc=useNet?net(i,p.id):score(i,p.id);if(sc!=null){t+=sc;c++}}return`<td><b>${c?t:'-'}</b></td>`}).join('')}<td></td></tr>`};
  for(let i=0;i<S.holes;i++){const mo=holeMoney(i),h=S.H[i];
    card+=`<tr><td><b>${i+1}</b></td><td>${h.par}</td>${hc?`<td class="muted">${h.si||''}</td>`:''}${S.players.map(p=>{const sc=score(i,p.id),e=h.s[p.id];
      return`<td class="${sc!=null&&sc<h.par?'sc-u':''}">${sc??'-'}${gir(i,p.id)?'<sup>●</sup>':''}${e&&penOf(e)?'<sup style="color:#c62828">P</sup>':''}${mo.pay[p.id]?`<small>${mo.pay[p.id]}฿</small>`:''}</td>`}).join('')}<td class="muted">${h.spin?h.spin.join(','):''}</td></tr>`;
    if(two&&i===8)card+=tot(0,9,'OUT');}
  if(two)card+=tot(9,18,'IN');card+=tot(0,S.holes,'Gross');if(hc)card+=tot(0,S.holes,'Net',true);

  app.innerHTML=`
  ${incomplete.length||unspun.length?`<div class="card"><h2>⚠️ ยังไม่ครบ</h2>

  <div class="card"><h2>📊 สรุปผล${S.course?` · ${esc(S.course)}`:''}</h2><p class="muted" style="margin-top:-6px">${thDate(S.date||today())}${S.tee?' · Tee '+esc(S.tee):''}</p>
    ${hc?`<div class="seg" style="margin-bottom:8px"><button data-act="sortBy" data-v="gross" class="${!byNet?'on':''}">เรียงตาม Gross</button><button data-act="sortBy" data-v="net" class="${byNet?'on':''}">เรียงตาม Net</button></div>`:''}

    <tr><th>#</th><th class="l">ผู้เล่น</th><th>Gross</th>${hc?'<th>Net</th>':''}<th>พัตต์</th><th>GIR</th><th>HCP</th><th>Course<br>HCP</th></tr>${top}</table></div>
    <p class="muted">Gross = สกอร์จริง (รวมลูกโทษ) · Net = Gross − แต้มต่อ<br>HCP = Handicap โดยประมาณจากรอบนี้ (WHS: ตัดสกอร์ต่อหลุมสูงสุดที่ Par+5, 113/Slope × (สกอร์ − Rating)${S.holes==9?', แปลงเป็น 18 หลุม':''}${S.cr?'':', ไม่ได้ใส่ Rating จึงใช้ Par'}${S.slope?'':', ไม่ได้ใส่ Slope จึงใช้ 113'})<br>
    Course HCP = แต้มต่อที่ควรได้ในสนามนี้ ใช้เป็นแต้มต่อรอบหน้าได้</p></div>
  ${aw?`<div class="card"><h2>🏅 รางวัลประจำรอบ</h2>${aw}</div>`:''}
  <div class="card"><h2>💰 เงิน & ค่ากับข้าวเที่ยง</h2><div class="big">กองกลาง ${pot} บาท</div>
    <label class="lb">ค่ากับข้าวเที่ยง (บาท)</label><input type="number" inputmode="numeric" data-set="lunch" value="${esc(S.lunch)}" placeholder="ใส่ยอดบิล">
    ${bill?`<div class="note">${extra?`กองกลางไม่พอ ขาด ${bill-pot} บาท → ทุกคนจ่ายเพิ่มคนละ <b>${extra} บาท</b>`:left?`กองกลางเหลือ <b>${left} บาท</b> หลังจ่ายค่ากับข้าว`:'กองกลางพอดีค่ากับข้าว 👍'}</div>`:''}
    <div class="scroll"><table><tr><th class="l">ผู้เล่น</th><th>ติดท้าย<br>(ครั้ง)</th><th>โดนวงล้อ<br>(ครั้ง)</th><th>เข้ากอง</th>${bill?'<th>รวมจ่าย<br>ค่าข้าว</th>':''}</tr>${moneyT}</table></div></div>
  ${bars?`<div class="card"><h2>📈 การกระจายสกอร์</h2><div class="legend">${legend}</div>${bars}
    <p class="muted">แตะที่แถบเพื่อดูจำนวนหลุม</p>
    <div class="scroll"><table><tr><th class="l">ผู้เล่น</th>${DIST.map(d=>`<th>${d[0]}</th>`).join('')}</tr>${distT}</table></div></div>`:''}
  ${parT?`<div class="card"><h2>⛳ สกอร์เฉลี่ยตาม Par${two?' / หน้า-หลัง 9':''}</h2><div class="scroll"><table>
    <tr><th class="l">ผู้เล่น</th><th>Par 3</th><th>Par 4</th><th>Par 5</th>${two?'<th>OUT</th><th>IN</th>':''}<th>หลุมดีสุด</th><th>หลุมแย่สุด</th></tr>${parT}</table></div>
    <p class="muted">ตัวเลขบน = สกอร์เฉลี่ย, ล่าง = เทียบ Par ต่อหลุม${hc?' · N = Net':''}</p></div>`:''}
  <div class="card"><h2>🚫 ลูกโทษ & บังเกอร์</h2><div class="scroll"><table>
    <tr><th class="l">ผู้เล่น</th><th>🌳 ป่า/หาย</th><th>💧 น้ำ</th><th>🚫 OB</th><th>แต้มโทษ</th><th>🏖️ ทราย</th><th>Sand<br>save</th></tr>${penT}</table></div>
    <p class="muted">Sand save = หลุมที่ลงบังเกอร์แต่ยังทำพาร์หรือดีกว่า</p></div>
  ${shortT?`<div class="card"><h2>🎯 พัตต์ & ลูกสั้น</h2><div class="scroll"><table>
    <tr><th class="l">ผู้เล่น</th><th>พัตต์<br>/หลุม</th><th>พัตต์<br>/GIR</th><th>1 พัตต์</th><th>3 พัตต์+</th><th>ชิปลง</th><th>Scram-<br>bling</th><th>Bounce<br>back</th></tr>${shortT}</table></div>
    <p class="muted">Scrambling = ไม่ได้ GIR แต่ยังทำพาร์ได้ · Bounce back = หลังเสียโบกี้ หลุมถัดไปทำพาร์ได้ · ชิปลง = จบหลุมโดยไม่ต้องพัตต์</p></div>`:''}
  <div class="card"><h2>🏌️ Tee-off</h2><div class="scroll"><table>
    <tr><th class="l">ผู้เล่น</th><th>⬅ ซ้าย</th><th>⬆ ตรง</th><th>ขวา ➡</th><th>Fairway<br>Par 4-5</th><th>สกอร์เมื่อ<br>ตีตรง</th><th>สกอร์เมื่อ<br>ไม่ตรง</th></tr>${teeT}</table></div>
    <p class="muted">Fairway % นับเฉพาะ Par 4-5 · สกอร์เมื่อตีตรง/ไม่ตรง = เฉลี่ยเทียบ Par ต่อหลุม</p></div>
  <div class="card"><h2>📋 สกอร์การ์ด</h2><div class="scroll"><table class="sc">${card}</table></div><p class="muted">สีแดง = ต่ำกว่า Par · ● = GIR · P = มีลูกโทษ · ตัวเลขเล็กสีแดง = เงินที่เสีย</p></div>
  ${courseCard()}
  <div class="card"><h2>🏁 จบรอบ</h2>
    <button class="btn full" data-act="img">📷 ส่งรูปสกอร์การ์ด</button>
    <button class="btn full" data-act="saveround">💾 ${HIST.some(r=>r.rid===S.rid)?'อัปเดตรอบนี้ในประวัติ':'บันทึกรอบนี้ลงประวัติ'}</button>
    <p class="muted">บันทึกแล้วจะใช้คิด Handicap Index ระยะยาว และจำข้อมูลสนามไว้ใช้รอบหน้า (ดูที่แท็บ 📚 ประวัติ)</p></div>
  ${syncCard()}
  <div class="card"><h2>📤 คัดลอกสรุป (ส่ง LINE)</h2><textarea id="txt" readonly>${esc(sumText(list,pot,extra,left))}</textarea>
    <button class="btn full" data-act="copy">คัดลอกข้อความ</button></div>`;
}
function sumText(list,pot,extra,left){
  const hc=hasHC();let tp=0;for(let i=0;i<S.holes;i++)tp+=S.H[i].par;
  let t=`⛳ ${S.course?S.course+' · ':''}${thDate(S.date||today())}\nสรุปรอบกอล์ฟ ${S.holes} หลุม (Par ${tp})${S.tee?' Tee '+S.tee:''}\n`;
  list.forEach((x,k)=>{const s=x.s,m=x.m;
    t+=`${k+1}. ${x.p.name}: ${s.gross} (${fd(s.gross-s.par)})${hc?` Net ${s.net} (${fd(s.net-s.par)})`:''} | พัตต์ ${s.putts} | GIR ${s.g}/${s.n} | ตรง ${s.st}/${s.st+s.l+s.r}${m.pen?` | โทษ +${m.pen}`:''} | เสีย ${s.money}฿ | HCP≈${s.hcp??'-'}\n`});
  if(S.cr||S.slope)t+=`📐 Rating ${S.cr||'-'} / Slope ${S.slope||'-'}\n`;
  const aw=awards(list);if(aw.length){t+=`\n🏅 รางวัล\n`;aw.forEach(a=>t+=`${a.icon} ${a.title}: ${a.names.join(', ')} (${a.v})\n`)}
  t+=`\n💰 กองกลางรวม ${pot} บาท`;
  if(+S.lunch)t+=`\n🍛 ค่ากับข้าว ${S.lunch} บาท → ${extra?`จ่ายเพิ่มคนละ ${extra} บาท`:left?`เหลือ ${left} บาท`:'พอดี'}`;
  return t;
}

/* ---------- sync (ส่ง/รับข้อมูล) ---------- */
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s)))}
function exportCode(){const o={...S};delete o.tab;delete o.cur;delete o.sun;delete o.wake;delete o.sortBy;o.from=S.myFlight;return'GOLF:'+b64e(JSON.stringify(o))}
async function doExport(){
  const code=exportCode(),label=S.myFlight==='all'?'ทุกคน':'ก๊วน '+S.myFlight;
  if(navigator.share){try{await navigator.share({text:code});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(code);toast(`คัดลอกข้อมูล (${label}) แล้ว ไปวางใน LINE ได้เลย`)}
  catch(e){showCode(code)}
}
function showCode(code){const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="dlgbox"><p>กดค้างที่ข้อความ → เลือกทั้งหมด → คัดลอก</p><textarea readonly>${esc(code)}</textarea><button class="btn full" data-r="1">ปิด</button></div>`;
  d.addEventListener('click',e=>{if(e.target.closest('[data-r]')){e.stopPropagation();d.remove()}});document.body.appendChild(d)}
function importDialog(){
  const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="dlgbox"><p>📥 วางข้อความที่ได้รับ (ขึ้นต้นด้วย GOLF:) หรือเลือกไฟล์</p><textarea id="imp" placeholder="กดค้างแล้วเลือก วาง"></textarea>
    <div class="grid2"><button class="btn sec" data-r="0">ยกเลิก</button><button class="btn" data-r="1">รวมข้อมูล</button></div>
    <button class="btn sec full" data-r="paste">📋 วางจากคลิปบอร์ด</button>
    <label class="btn sec full" style="display:block;box-sizing:border-box">📁 เลือกไฟล์<input type="file" id="impf" accept=".txt,text/plain" style="display:none"></label></div>`;
  d.querySelector('#impf').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;const txt=await f.text();
    const ok=txt.includes('GOLFH:')?importHist(txt):await doImport(txt.trim());if(ok)d.remove()});
  d.addEventListener('click',async e=>{const b=e.target.closest('[data-r]');if(!b)return;e.stopPropagation();
    const ta=d.querySelector('#imp');
    if(b.dataset.r==='paste'){try{ta.value=await navigator.clipboard.readText()}catch(er){toast('วางเองโดยกดค้างที่ช่อง')}return}
    if(b.dataset.r==='0'){d.remove();return}
    const v=ta.value.trim(),ok=v.includes('GOLFH:')?importHist(v):await doImport(v);if(ok)d.remove();});
  document.body.appendChild(d);
}
function anyData(st){return st.H.some(h=>Object.values(h.s||{}).some(hasData))}
async function doImport(txt){
  let I;try{const m=txt.match(/GOLF:([A-Za-z0-9+/=]+)/);I=migrate(JSON.parse(b64d(m[1])))}catch(e){toast('ข้อมูลไม่ถูกต้อง ลองคัดลอกใหม่');return false}
  if(I.rid!==S.rid){
    if(anyData(S)&&!(await ask('ข้อมูลนี้เป็นคนละรอบกับในเครื่อง ต้องการแทนที่ข้อมูลในเครื่องทั้งหมด?')))return false;
    const keep={tab:S.tab,cur:0,sun:S.sun,wake:S.wake,sortBy:S.sortBy,myFlight:S.myFlight};
    S=Object.assign(I,keep);delete S.from;
    if(S.myFlight!=='all'&&!flightsUsed().includes(S.myFlight))S.myFlight='all';
    save();render();toast('รับข้อมูลรอบแล้ว ✓'+(flightsUsed().length>1?' อย่าลืมเลือก "เครื่องนี้จดของ" ก๊วนตัวเอง':''));return true;
  }
  // รอบเดียวกัน → รวม
  let cnt=0;
  I.players.forEach(ip=>{const lp=P(ip.id);
    if(!lp){S.players.push(ip);return}
    if(I.from!=='all'&&ip.flight===I.from){lp.name=ip.name;lp.hc=ip.hc}
    else{if(lp.hc===''&&ip.hc!=='')lp.hc=ip.hc}});
  ['cr','slope','lunch'].forEach(k=>{if((S[k]===''||S[k]==null)&&I[k])S[k]=I[k]});
  I.H.forEach((ih,i)=>{const lh=S.H[i];
    if(!lh.parSet&&ih.parSet){lh.par=ih.par;lh.parSet=true}
    if(lh.si===''&&ih.si!=='')lh.si=ih.si;
    if(!lh.spin&&ih.spin)lh.spin=ih.spin;
    for(const pid in ih.s){const ie=ih.s[pid],le=lh.s[pid],pl=P(pid);if(!pl||!hasData(ie))continue;
      const owner=I.from!=='all'&&pl.flight===I.from;
      if(!hasData(le)||(owner&&JSON.stringify(le)!==JSON.stringify(ie))){lh.s[pid]={...ie};cnt++}}
  });
  save();render();toast(`รวมข้อมูลแล้ว ✓ อัปเดต ${cnt} รายการ`);return true;
}

/* ---------- ประวัติรอบ / Handicap Index / สนามที่บันทึกไว้ ---------- */
const HKEY='golf_history_v1',CKEY='golf_courses_v1',APPVER='2026.11.01';
function loadJ(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function saveJ(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let HIST=loadJ(HKEY,[]),COURSES=loadJ(CKEY,{});
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function thDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${+d} ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m-1]} ${(+y+543)%100}`}
function totalParOf(){let t=0;for(let i=0;i<S.holes;i++)t+=S.H[i].par;return t}
function roundSummary(){
  return{rid:S.rid,date:S.date||today(),course:S.course.trim(),tee:S.tee,holes:S.holes,cr:S.cr,slope:S.slope,par:totalParOf(),
    players:S.players.map(p=>{const s=stats(p.id),m=more(p.id);return{name:p.name.trim(),hc:p.hc,gross:s.gross,net:s.net,par:s.par,n:s.n,putts:s.putts,g:s.g,
      money:s.money,pen:m.pen,diff:s.n===S.holes?s.hcp:null,sc:Array.from({length:S.holes},(_,i)=>score(i,p.id))}})};
}
function saveCourse(){const n=S.course.trim();if(!n)return;
  COURSES[n]={name:n,holes:S.holes,tee:S.tee,cr:S.cr,slope:S.slope,pars:S.H.slice(0,S.holes).map(h=>h.par),si:S.H.slice(0,S.holes).map(h=>h.si)};saveJ(CKEY,COURSES)}
function loadCourse(n){const c=COURSES[n];if(!c)return;
  S.holes=c.holes;S.tee=c.tee||S.tee;S.cr=c.cr;S.slope=c.slope;
  c.pars.forEach((p,i)=>{S.H[i].par=p;S.H[i].parSet=true;S.H[i].si=c.si[i]||''});save();render();toast(`โหลดข้อมูลสนาม ${n} แล้ว ✓`)}
function saveRound(){
  const r=roundSummary();if(!r.players.some(p=>p.n)){toast('ยังไม่มีคะแนน');return}
  const k=HIST.findIndex(x=>x.rid===r.rid);if(k>=0)HIST[k]=r;else HIST.push(r);
  HIST.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);saveJ(HKEY,HIST);saveCourse();
  toast(k>=0?'อัปเดตประวัติรอบนี้แล้ว ✓':'บันทึกรอบนี้ลงประวัติแล้ว ✓');render();
}
// WHS: จำนวนรอบ → ใช้กี่รอบที่ดีที่สุด, ปรับค่า
const WHS=[[3,1,-2],[4,1,-1],[5,1,0],[6,2,-1],[8,2,0],[11,3,0],[14,4,0],[16,5,0],[18,6,0],[19,7,0],[20,8,0]];
function hIndex(diffs){const d=diffs.slice(-20),n=d.length;if(n<3)return null;
  const row=WHS.find(r=>n<=r[0]),best=[...d].sort((a,b)=>a-b).slice(0,row[1]);
  return Math.round((best.reduce((a,b)=>a+b,0)/best.length+row[2])*10)/10}
function playerHist(){const m={};
  HIST.forEach(r=>r.players.forEach(p=>{if(!p.n)return;const k=p.name;(m[k]=m[k]||{name:k,rounds:0,diffs:[],gross:[],full:[]});
    m[k].rounds++;if(p.diff!=null){m[k].diffs.push(p.diff);if(r.holes==18)m[k].full.push(p.gross)}}));
  return Object.values(m).map(x=>({...x,hi:hIndex(x.diffs),avgDiff:x.diffs.length?Math.round(x.diffs.reduce((a,b)=>a+b,0)/x.diffs.length*10)/10:null,
    best:x.full.length?Math.min(...x.full):null,avg:x.full.length?Math.round(x.full.reduce((a,b)=>a+b,0)/x.full.length*10)/10:null})).sort((a,b)=>(a.hi??a.avgDiff??99)-(b.hi??b.avgDiff??99));
}
function courseHC(hi){const tp=totalParOf(),slope=+S.slope||113,cr=+S.cr||tp,f=S.holes==9?0.5:1;return Math.round(hi*f*slope/113+(cr-tp))}

  const rounds=[...HIST].reverse().map(r=>{const ps=[...r.players].filter(p=>p.n).sort((a,b)=>(a.gross-a.par)-(b.gross-b.par));
    return`<div class="card"><div class="ptop"><span><b>${esc(r.course||'ไม่ระบุสนาม')}</b>${r.tee?` <span class="muted">(${esc(r.tee)})</span>`:''}<br><span class="muted">${thDate(r.date)} · ${r.holes} หลุม · Par ${r.par}${r.cr?` · ${r.cr}/${r.slope||113}`:''}</span></span>
      <button class="x" data-act="delround" data-v="${r.rid}">🗑</button></div>
      <table><tr><th class="l">ผู้เล่น</th><th>Gross</th><th>Net</th><th>พัตต์</th><th>Diff</th><th>เสีย</th></tr>${ps.map(p=>`<tr><td class="l">${esc(p.name)}</td><td><b>${p.gross}</b> <span class="muted">${fd(p.gross-p.par)}</span></td><td>${p.net}</td><td>${p.putts}</td><td>${p.diff??'-'}</td><td class="pay">${p.money}฿</td></tr>`).join('')}</table></div>`}).join('');
  const cs=Object.values(COURSES).map(c=>`<div class="trow"><span><b>${esc(c.name)}</b> <span class="muted">${c.holes} หลุม · Par ${c.pars.reduce((a,b)=>a+b,0)}${c.cr?` · ${c.cr}/${c.slope||113}`:''}${c.tee?' · '+esc(c.tee):''}</span></span><button class="x" data-act="delcourse" data-v="${esc(c.name)}">🗑</button></div>`).join('');
  app.innerHTML=`

    ${hiT?`<div class="scroll"><table><tr><th class="l">ผู้เล่น</th><th>รอบ</th><th>HI</th><th>ดีสุด<br>(18)</th><th>เฉลี่ย<br>(18)</th></tr>${hiT}</table></div>
    <p class="muted">คิดแบบ WHS จาก 20 รอบล่าสุด (เช่น มี 20 รอบ ใช้ค่าเฉลี่ย 8 รอบที่ดีที่สุด) ต้องมีอย่างน้อย 3 รอบที่ตีครบ ถ้ายังไม่ถึงจะแสดง ~ค่าเฉลี่ย · จับคู่ผู้เล่นด้วยชื่อ ควรพิมพ์ชื่อให้เหมือนเดิมทุกรอบ</p>
    <button class="btn full" data-act="applyhi">📥 ใส่แต้มต่อรอบปัจจุบันจาก HI</button>
    <p class="muted">แต้มต่อ = Course Handicap ของสนามที่ตั้งไว้ (HI × Slope/113 + Rating − Par)</p>`
    :'<p class="muted">ยังไม่มีประวัติ จบรอบแล้วกด "💾 บันทึกรอบนี้ลงประวัติ" ในหน้าสรุป</p>'}</div>
  ${rounds?`<h2 style="font-size:16px;color:#1b5e20;margin:16px 4px 8px">📅 รอบที่ผ่านมา (${HIST.length})</h2>${rounds}`:''}
  <div class="card"><h2>📍 สนามที่บันทึกไว้</h2>${cs||'<p class="muted">ยังไม่มี ระบบจะจำ Par / HCP หลุม / Rating / Slope ให้อัตโนมัติเมื่อบันทึกรอบที่ใส่ชื่อสนาม</p>'}</div>
  <div class="card"><h2>💾 สำรองประวัติ</h2>
    <div class="grid2"><button class="btn" data-act="exporthist">📤 ส่งประวัติ</button><button class="btn sec" data-act="import">📥 รับประวัติ</button></div>
    <p class="muted">ประวัติเก็บในเครื่องนี้เท่านั้น ควรส่งสำรองเข้า LINE ตัวเองเป็นครั้งคราว หรือย้ายไปเครื่องใหม่</p>
    <p class="muted" style="text-align:center">Golf Score เวอร์ชัน ${APPVER}</p></div>`;
}

    cell(lab,W-M-SW/2,y+RH/2,{b:1});cell(String(tp),W-M-SW/2,y+RH*1.5,{c:'#556'});y+=RH*2;
    ps.forEach((p,k)=>{if(k%2){x.fillStyle='#f7faf7';x.fillRect(M,y,W-2*M,RH)}
      x.textAlign='left';cell(p.name.slice(0,9),M+10,y+RH/2,{b:1});x.textAlign='center';let t=0,n=0;

        if(d<0){x.strokeStyle='#c62828';x.lineWidth=2.5;x.beginPath();x.arc(cx,cy,18,0,7);x.stroke();if(d<-1){x.beginPath();x.arc(cx,cy,23,0,7);x.stroke()}}
        else if(d>0){x.strokeStyle='#1565c0';x.lineWidth=2;x.strokeRect(cx-17,cy-17,34,34);if(d>1)x.strokeRect(cx-22,cy-22,44,44)}
        cell(String(sc),cx,cy+1,{b:1,c:d<0?'#c62828':'#1c2b1c'})}
      cell(n?String(t):'-',W-M-SW/2,y+RH/2,{b:1});y+=RH});

  const cols=['ผู้เล่น','Gross','+/-',...(hc?['Net']:[]),'พัตต์','GIR','เสีย'],cw2=(W-2*M-200)/(cols.length-1);

/* ---------- ส่งเป็นไฟล์ ---------- */
async function shareFile(code,name){
  const file=new File([code],name,{type:'text/plain'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return true}catch(e){if(e&&e.name==='AbortError')return true}}
  return false;
}
async function doExportFile(){const code=exportCode(),fl=S.myFlight==='all'?'all':S.myFlight;
  if(!(await shareFile(code,`golf-${S.date||today()}-${fl}.txt`))){toast('เครื่องนี้ส่งไฟล์ไม่ได้ ใช้ "ส่งเป็นข้อความ" แทน');doExport()}}
async function doExportHist(){const code='GOLFH:'+b64e(JSON.stringify({h:HIST,c:COURSES}));
  if(await shareFile(code,`golf-history-${today()}.txt`))return;
  if(navigator.share){try{await navigator.share({text:code});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(code);toast('คัดลอกประวัติแล้ว')}catch(e){showCode(code)}}
function importHist(txt){try{const m=txt.match(/GOLFH:([A-Za-z0-9+/=]+)/),o=JSON.parse(b64d(m[1]));let n=0;
  o.h.forEach(r=>{if(!HIST.some(x=>x.rid===r.rid)){HIST.push(r);n++}});Object.assign(COURSES,o.c||{});
  HIST.sort((a,b)=>a.date<b.date?-1:1);saveJ(HKEY,HIST);saveJ(CKEY,COURSES);render();toast(`รับประวัติแล้ว ✓ เพิ่ม ${n} รอบ`);return true}
  catch(e){toast('ข้อมูลประวัติไม่ถูกต้อง');return false}}

/* ---------- dialogs ---------- */
function ask(msg){return new Promise(res=>{
  const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="dlgbox"><p>${esc(msg)}</p><div class="grid2"><button class="btn sec" data-r="0">ยกเลิก</button><button class="btn" data-r="1">ตกลง</button></div></div>`;
  d.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;e.stopPropagation();d.remove();res(b.dataset.r==='1')});

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- กันจอดับ ---------- */
let wl=null;
async function keepAwake(){
  if(!S.wake){if(wl){try{await wl.release()}catch(e){}wl=null}return}
  if(wl||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){}
}
document.addEventListener('visibilitychange',keepAwake);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(spinning||e.target.closest('.dlg'))return;
  keepAwake();
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;save();render();scrollTo(0,0);return}
  const a=t.dataset.act,v=t.dataset.v,pid=t.dataset.p,h=S.H[S.cur];
  switch(a){
    case 'addp':if(S.players.length<10){const cnt=f=>S.players.filter(p=>p.flight===f).length;
      S.players.push({id:uid(),name:'ผู้เล่น '+(S.players.length+1),flight:cnt('A')<4?'A':cnt('B')<4?'B':'C',hc:''})}break;
    case 'delp':{const p=P(pid);ask(`ลบ "${p.name}" ?`).then(ok=>{if(ok){S.players=S.players.filter(q=>q.id!==pid);save();render()}});return}
    case 'flight':{const p=P(pid);p.flight=FLIGHTS[(FLIGHTS.indexOf(p.flight)+1)%FLIGHTS.length];if(S.myFlight!=='all'&&!flightsUsed().includes(S.myFlight))S.myFlight='all';break}
    case 'myf':S.myFlight=v;break;
    case 'holes':S.holes=+v;if(S.cur>=S.holes)S.cur=S.holes-1;break;
    case 'moneyBy':S.moneyBy=v;break;
    case 'sortBy':S.sortBy=v;break;
    case 'sun':S.sun=!S.sun;break;
    case 'wake':S.wake=!S.wake;keepAwake();toast(S.wake?'💡 กันจอดับ: เปิด':'กันจอดับ: ปิด');break;
    case 'go':if(!S.players.length){toast('เพิ่มผู้เล่นก่อน');return}S.tab='hole';scrollTo(0,0);break;
    case 'resetround':ask('ล้างคะแนนทุกหลุม? (กู้คืนไม่ได้) รอบที่บันทึกลงประวัติแล้วจะยังอยู่').then(ok=>{if(ok){S.H=newHoles();S.cur=0;S.rid=uid();S.lunch='';S.remind={};S.date=today();save();render();toast('ล้างคะแนนแล้ว')}});return;
    case 'prev':if(S.cur>0)S.cur--;scrollTo(0,0);break;
    case 'next':if(S.cur<S.holes-1)S.cur++;scrollTo(0,0);break;
    case 'jump':S.cur=+v;scrollTo(0,0);break;
    case 'gospin':S.cur=+v;S.tab='hole';render();setTimeout(()=>{const w=document.getElementById('wheel');if(w)w.scrollIntoView({block:'center'})},50);return;
    case 'tab':S.tab=v;scrollTo(0,0);break;
    case 'par':h.par=+v;h.parSet=true;break;
    case 'inc':case 'dec':{const en=ent(S.cur,pid),f=t.dataset.f;h.parSet=true;
      if(en[f]==null)en[f]=f==='on'?Math.max(1,h.par-2):2;
      else if(a==='inc')en[f]=Math.min(20,en[f]+1);
      else{const min=f==='on'?1:0;en[f]=en[f]<=min?null:en[f]-1}
      break}
    case 'tee':{const en=ent(S.cur,pid);en.tee=en.tee===v?null:v;break}
    case 'pen':{const en=ent(S.cur,pid);en[v]=((en[v]||0)+1)%4;break}
    case 'spin':doSpin();return;
    case 'tieRule':S.tieRule=v;break;
    case 'loadcourse':loadCourse(S.course.trim());return;
    case 'exportfile':doExportFile();return;
    case 'exporthist':doExportHist();return;
    case 'img':scoreImage();return;
    case 'saveround':saveRound();return;
    case 'delround':ask('ลบรอบนี้ออกจากประวัติ?').then(ok=>{if(ok){HIST=HIST.filter(r=>r.rid!==v);saveJ(HKEY,HIST);render()}});return;
    case 'delcourse':ask(`ลบสนาม "${v}"?`).then(ok=>{if(ok){delete COURSES[v];saveJ(CKEY,COURSES);render()}});return;
    case 'applyhi':{const ph=playerHist();let n=0;S.players.forEach(p=>{const x=ph.find(y=>y.name===p.name.trim());const hi=x&&(x.hi??x.avgDiff);
      if(hi!=null){p.hc=String(Math.max(0,courseHC(hi)));n++}});save();toast(n?`ใส่แต้มต่อให้ ${n} คนแล้ว ✓ ดูในหน้าตั้งค่า`:'ไม่พบชื่อที่ตรงกับประวัติ');return}
    case 'spinall':ask('สุ่มวงล้อทุกหลุมที่ยังไม่ได้หมุนทันที (ไม่มีแอนิเมชัน)?').then(ok=>{if(!ok)return;let c=0;
      for(let i=0;i<S.holes;i++){if(!holeDone(i)||S.H[i].spin)continue;const N=holeMoney(i).pool;if(!N)continue;
        const x=rnd(N)+1;let y=x;if(N>=2)while(y===x)y=rnd(N)+1;S.H[i].spin=N>=2?[x,y]:[x];c++}
      save();render();toast(`สุ่มแล้ว ${c} หลุม ✓ ดูผลได้ในสกอร์การ์ด (คอลัมน์ 🎡)`)});return;
    case 'tip':toast(v);return;
    case 'export':doExport();return;
    case 'import':importDialog();return;
    case 'copy':{const ta=document.getElementById('txt');ta.select();
      (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('คัดลอกแล้ว ✓'),()=>{try{document.execCommand('copy');toast('คัดลอกแล้ว ✓')}catch(er){toast('กดค้างที่ข้อความเพื่อคัดลอก')}});return}
  }
  save();render();
  if(['inc','dec','pen'].includes(a)){const last=S.holes-1;
    for(const k of [8,last])if(k<S.holes&&!S.remind[k]&&visDone(k)&&(k===last||S.holes===18)){S.remind[k]=1;save();
      setTimeout(()=>toast(k===last?'🏁 จบรอบ! กด 📤 ส่งข้อมูล ให้อีกก๊วน/สำรอง แล้วไปดูสรุป':'💾 ครบ 9 หลุม อย่าลืมกด 📤 ส่งข้อมูล (สำรอง/ส่งอีกก๊วน)'),300);break}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pname){const p=P(t.dataset.pname);if(p)p.name=t.value;save()}
  if(t.dataset.phc){const p=P(t.dataset.phc);if(p)p.hc=t.value;save()}
  if(t.dataset.hset){S.H[S.cur][t.dataset.hset]=t.value;save()}
  if(t.dataset.set){const k=t.dataset.set;S[k]=t.value===''?'':(['cr','slope','lunch','course','tee','date'].includes(k)?t.value:Math.max(0,+t.value));save()}
});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.set||d.phc||d.hset)setTimeout(()=>{const f=document.activeElement;if(!f||!f.matches('input'))render()},0)});
render();keepAwake();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
