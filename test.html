<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบคีย์บอร์ด</title>
<style>
body{font-family:-apple-system,sans-serif;padding:16px;font-size:17px;background:#f4f7f4}
h2{font-size:18px;color:#1b5e20;margin:22px 0 8px}
input{display:block;width:100%;box-sizing:border-box;font-size:17px;padding:12px;margin:8px 0;border:2px solid #888;border-radius:10px;background:#fff}
button{font-size:17px;padding:12px;border-radius:10px;border:0;background:#1b5e20;color:#fff;width:100%}
#st{background:#fff8e1;padding:10px;border-radius:10px;font-size:15px;white-space:pre-line}
</style>
</head>
<body>
<b>หน้าทดสอบคีย์บอร์ด (Golf Score)</b>
<div id="st">สถานะ: -</div>

<h2>ทดสอบ 1: ช่องธรรมดา</h2>
<input type="text" placeholder="แตะแล้วพิมพ์ตัวหนังสือ">
<input type="number" inputmode="numeric" placeholder="แตะแล้วพิมพ์ตัวเลข">

<h2>ทดสอบ 2: หลังเปิดกันจอดับ</h2>
<button id="wl">กดเปิดกันจอดับ</button>
<input type="text" placeholder="กดปุ่มด้านบนก่อน แล้วแตะช่องนี้">

<script>
const st=document.getElementById('st');
function log(m){st.textContent=m}
document.addEventListener('focusin',e=>log('ช่องได้ focus แล้ว (ควรมีเคอร์เซอร์กะพริบ)'));
document.getElementById('wl').onclick=async()=>{
  if(!('wakeLock' in navigator)){log('เครื่องนี้ไม่รองรับกันจอดับ');return}
  try{await navigator.wakeLock.request('screen');log('เปิดกันจอดับแล้ว ลองแตะช่องด้านล่าง')}catch(e){log('เปิดกันจอดับไม่ได้: '+e.message)}
};
</script>
</body>
</html>
